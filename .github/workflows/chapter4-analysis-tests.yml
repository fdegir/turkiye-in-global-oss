name: Chapter 4 analysis tests
on:
  pull_request:
    paths:
      - 'scripts/analysis/**'
      - 'tests/**'
      - 'data/metadata/wdi_reference.csv'
      - 'requirements-analysis.txt'
      - '.github/workflows/chapter4-analysis-tests.yml'
  workflow_dispatch:
jobs:
  synthetic-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -p 'test_analysis_*.py' -v
